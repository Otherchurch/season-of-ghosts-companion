function buildSearchIndex(){
  const idx = [];
  BOOKS.forEach(b=>{
    b.npcs.forEach(n=> idx.push({type:"NPC", book:b.id, name:n.name, meta:n.role+" · "+n.location, go:()=>{state.book=b.id; state.view="npcs"; renderTabs(); renderNav(); renderMain();}}));
    b.locations.forEach(l=> idx.push({type:"Locatie", book:b.id, name:l.name, meta:l.desc.slice(0,80), go:()=>{state.book=b.id; state.view="locations"; renderTabs(); renderNav(); renderMain();}}));
    b.chapters.forEach(c=> idx.push({type:"Hoofdstuk", book:b.id, name:c.name, meta:"p."+c.pages, go:()=>{state.book=b.id; state.view="chapters"; renderTabs(); renderNav(); renderMain();}}));
  });
  CONNECTIONS.forEach(c=> idx.push({type:"Connectie", book:0, name:c.a+" ↔ "+c.b, meta:c.rel.slice(0,80), go:()=>{state.view="connections"; renderNav(); renderMain();}}));
  return idx;
}

/* =========================================================================
   NOTES (localStorage + optional GitHub cloud sync)
   ========================================================================= */
const NOTES_KEY = "sog_notes_v1";
function loadNotes(){ try{ return JSON.parse(localStorage.getItem(NOTES_KEY)) || []; }catch(e){ return []; } }
function saveNotes(notes){ localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }
let activeNoteId = null;

const SESSIONS_KEY = "sog_sessions_v1";
function loadSessions(){ try{ return JSON.parse(localStorage.getItem(SESSIONS_KEY)) || []; }catch(e){ return []; } }
function saveSessions(sessions){ localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions)); }
let activeSessionId = null;

/* ---- Cloud sync via GitHub Contents API ----
   Notes (including soft-deleted ones, as tombstones) are mirrored to a
   notes.json file in a GitHub repo. Sync is optional: without a token,
   everything still works locally via localStorage only. */
const GH_OWNER = "Otherchurch";
const GH_REPO = "season-of-ghosts-companion";
const GH_PATH = "notes.json";
const GH_BRANCH = "main";
const GH_TOKEN_KEY = "sog_gh_pat";
const GH_SHA_KEY = "sog_gh_sha";

function getGhToken(){ return localStorage.getItem(GH_TOKEN_KEY) || ""; }
function setGhToken(t){ if(t) localStorage.setItem(GH_TOKEN_KEY, t); else { localStorage.removeItem(GH_TOKEN_KEY); localStorage.removeItem(GH_SHA_KEY); localStorage.removeItem(GH_SESSIONS_SHA_KEY); } }
function getGhSha(){ return localStorage.getItem(GH_SHA_KEY) || null; }
function setGhSha(s){ if(s) localStorage.setItem(GH_SHA_KEY, s); else localStorage.removeItem(GH_SHA_KEY); }

function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUtf8(b64){ return decodeURIComponent(escape(atob(b64.replace(/\n/g,"")))); }

let syncState = { status: "off", lastSync: null, error: null }; // off | idle | syncing | error
function setSyncState(patch){ syncState = Object.assign({}, syncState, patch); updateSyncBadge(); }
function updateSyncBadge(){
  const dot = document.getElementById("syncDot");
  const label = document.getElementById("syncLabel");
  if(!dot || !label) return;
  dot.className = "sync-dot" + (syncState.status==="error" ? " err" : (syncState.status!=="off" ? " on" : ""));
  const when = syncState.lastSync ? new Date(syncState.lastSync).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) : null;
  if(syncState.status==="off") label.textContent = "Cloud sync uit — notities blijven alleen lokaal in deze browser.";
  else if(syncState.status==="syncing") label.textContent = "Synchroniseren...";
  else if(syncState.status==="error") label.textContent = "Sync-fout: " + (syncState.error||"onbekend") + (when?(" · laatst gelukt "+when):"");
  else label.textContent = "Cloud sync actief" + (when?(" · laatst gesynced "+when):"") + " — " + GH_OWNER + "/" + GH_REPO;
}

async function ghRequest(method, path, body){
  const token = getGhToken();
  const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}?ref=${GH_BRANCH}`;
  const headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  if(method==="PUT") headers["Content-Type"] = "application/json";
  const res = await fetch(method==="PUT" ? url.split("?")[0] : url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  return res;
}

async function ghPullNotes(){
  if(!getGhToken()) return null;
  const res = await ghRequest("GET", GH_PATH);
  if(res.status === 404){ setGhSha(null); return []; }
  if(!res.ok) throw new Error(res.status===401||res.status===403 ? "ongeldige of te beperkte token" : ("HTTP "+res.status));
  const data = await res.json();
  setGhSha(data.sha);
  try{ return JSON.parse(b64DecodeUtf8(data.content)); }catch(e){ return []; }
}

async function ghPushNotes(notes, retriesLeft){
  if(retriesLeft === undefined) retriesLeft = 2;
  if(!getGhToken()) return;
  const payload = { message: "Update notes.json", content: b64EncodeUtf8(JSON.stringify(notes, null, 2)), branch: GH_BRANCH };
  const sha = getGhSha();
  if(sha) payload.sha = sha;
  const res = await ghRequest("PUT", GH_PATH, payload);
  if(res.status === 409 || res.status === 422){
    if(retriesLeft <= 0) throw new Error("blijvend conflict, probeer later opnieuw");
    const remote = await ghPullNotes();
    const merged = mergeNotes(remote||[], notes);
    saveNotes(merged);
    return ghPushNotes(merged, retriesLeft-1);
  }
  if(!res.ok) throw new Error(res.status===401||res.status===403 ? "ongeldige of te beperkte token" : ("HTTP "+res.status));
  const data = await res.json();
  if(data.content && data.content.sha) setGhSha(data.content.sha);
}

/* ---- Sessions: same GitHub-mirrored pattern as Notes, separate file ---- */
const GH_SESSIONS_PATH = "sessions.json";
const GH_SESSIONS_SHA_KEY = "sog_gh_sha_sessions";
function getGhSessionsSha(){ return localStorage.getItem(GH_SESSIONS_SHA_KEY) || null; }
function setGhSessionsSha(s){ if(s) localStorage.setItem(GH_SESSIONS_SHA_KEY, s); else localStorage.removeItem(GH_SESSIONS_SHA_KEY); }

async function ghPullSessions(){
  if(!getGhToken()) return null;
  const res = await ghRequest("GET", GH_SESSIONS_PATH);
  if(res.status === 404){ setGhSessionsSha(null); return []; }
  if(!res.ok) throw new Error(res.status===401||res.status===403 ? "ongeldige of te beperkte token" : ("HTTP "+res.status));
  const data = await res.json();
  setGhSessionsSha(data.sha);
  try{ return JSON.parse(b64DecodeUtf8(data.content)); }catch(e){ return []; }
}

async function ghPushSessions(sessions, retriesLeft){
  if(retriesLeft === undefined) retriesLeft = 2;
  if(!getGhToken()) return;
  const payload = { message: "Update sessions.json", content: b64EncodeUtf8(JSON.stringify(sessions, null, 2)), branch: GH_BRANCH };
  const sha = getGhSessionsSha();
  if(sha) payload.sha = sha;
  const res = await ghRequest("PUT", GH_SESSIONS_PATH, payload);
  if(res.status === 409 || res.status === 422){
    if(retriesLeft <= 0) throw new Error("blijvend conflict, probeer later opnieuw");
    const remote = await ghPullSessions();
    const merged = mergeNotes(remote||[], sessions); // mergeNotes is generic (id + updated)
    saveSessions(merged);
    return ghPushSessions(merged, retriesLeft-1);
  }
  if(!res.ok) throw new Error(res.status===401||res.status===403 ? "ongeldige of te beperkte token" : ("HTTP "+res.status));
  const data = await res.json();
  if(data.content && data.content.sha) setGhSessionsSha(data.content.sha);
}

// Last-write-wins per note id, keyed on `updated`. Deletions are tombstones
// (deleted:true) so they propagate instead of "resurrecting" on merge.
function mergeNotes(a, b){
  const byId = new Map();
  [...a, ...b].forEach(n=>{
    const existing = byId.get(n.id);
    if(!existing || n.updated > existing.updated) byId.set(n.id, n);
  });
  return Array.from(byId.values());
}

let syncPollTimer = null;
let syncPushTimer = null;
function scheduleSyncPush(){
  if(!getGhToken()) return;
  clearTimeout(syncPushTimer);
  setSyncState({status:"syncing"});
  syncPushTimer = setTimeout(async ()=>{
    try{ await ghPushNotes(loadNotes()); if(getGhToken()) setSyncState({status:"idle", lastSync: Date.now(), error:null}); }
    catch(e){ if(getGhToken()) setSyncState({status:"error", error:e.message}); }
  }, 1500);
}
async function syncPullAndMerge(){
  if(!getGhToken()) return;
  try{
    const remote = await ghPullNotes();
    if(!getGhToken()) return; // disconnected while this request was in flight
    if(remote){
      const merged = mergeNotes(loadNotes(), remote);
      saveNotes(merged);
    }
    setSyncState({status:"idle", lastSync: Date.now(), error:null});
  }catch(e){ if(getGhToken()) setSyncState({status:"error", error:e.message}); }
}
let syncPushTimerSessions = null;
function scheduleSessionsSyncPush(){
  if(!getGhToken()) return;
  clearTimeout(syncPushTimerSessions);
  setSyncState({status:"syncing"});
  syncPushTimerSessions = setTimeout(async ()=>{
    try{ await ghPushSessions(loadSessions()); if(getGhToken()) setSyncState({status:"idle", lastSync: Date.now(), error:null}); }
    catch(e){ if(getGhToken()) setSyncState({status:"error", error:e.message}); }
  }, 1500);
}
async function syncPullAndMergeSessions(){
  if(!getGhToken()) return;
  try{
    const remote = await ghPullSessions();
    if(!getGhToken()) return; // disconnected while this request was in flight
    if(remote){
      const merged = mergeNotes(loadSessions(), remote);
      saveSessions(merged);
    }
    setSyncState({status:"idle", lastSync: Date.now(), error:null});
  }catch(e){ if(getGhToken()) setSyncState({status:"error", error:e.message}); }
}

function startSyncPolling(){
  clearInterval(syncPollTimer);
  if(!getGhToken()) return;
  syncPullAndMerge();
  syncPullAndMergeSessions();
  syncPollTimer = setInterval(async ()=>{
    await syncPullAndMerge();
    await syncPullAndMergeSessions();
    if(state.view === "notes" || state.view === "sessions") renderMain();
  }, 8000);
}
startSyncPolling();

function renderSyncPanel(main){
  const hasToken = !!getGhToken();
  const syncPanel = el("div","sync-panel"+(hasToken?"":" setup"));
  const syncRow = el("div","sync-row");
  syncRow.appendChild(el("div","sync-dot","")); syncRow.lastChild.id = "syncDot";
  syncRow.appendChild(el("span","sync-label","")); syncRow.lastChild.id = "syncLabel";
  syncPanel.appendChild(syncRow);

  if(hasToken){
    const toggleRow = el("div","sync-row"); toggleRow.style.marginTop="8px";
    const offBtn = el("button","btn","Ontkoppelen");
    offBtn.onclick = ()=>{
      setGhToken(""); clearInterval(syncPollTimer); setSyncState({status:"off", error:null});
      renderMain();
    };
    toggleRow.appendChild(offBtn);
    syncPanel.appendChild(toggleRow);
  } else {
    const setupRow = el("div","sync-row"); setupRow.style.marginTop="8px";
    const tokenInput = el("input",""); tokenInput.type="password"; tokenInput.placeholder="GitHub fine-grained token (github_pat_...)";
    const connectBtn = el("button","btn primary","Verbind");
    connectBtn.onclick = async ()=>{
      const t = tokenInput.value.trim();
      if(!t) return;
      setGhToken(t);
      setSyncState({status:"syncing", error:null});
      try{
        const [remoteNotes, remoteSessions] = await Promise.all([ghPullNotes(), ghPullSessions()]);
        const mergedNotes = mergeNotes(loadNotes(), remoteNotes||[]);
        saveNotes(mergedNotes);
        const mergedSessions = mergeNotes(loadSessions(), remoteSessions||[]);
        saveSessions(mergedSessions);
        await Promise.all([ghPushNotes(mergedNotes), ghPushSessions(mergedSessions)]);
        setSyncState({status:"idle", lastSync: Date.now(), error:null});
        startSyncPolling();
        renderMain();
      }catch(e){
        setSyncState({status:"error", error:e.message});
      }
    };
    setupRow.appendChild(tokenInput);
    setupRow.appendChild(connectBtn);
    syncPanel.appendChild(setupRow);
    syncPanel.appendChild(el("div","sync-help",
      `Wil je dat notities en sessievoorbereiding op al je toestellen tegelijk verschijnen? Maak op <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> `+
      `een <strong>fine-grained token</strong> aan, alleen voor de repository <code>${GH_OWNER}/${GH_REPO}</code>, met "Contents" op <strong>Read and write</strong>. Plak de token hierboven. `+
      `De token wordt alleen lokaal in deze browser bewaard, nooit gedeeld.`));
  }
  main.appendChild(syncPanel);
  updateSyncBadge();
}

function renderNotes(main){
  main.appendChild(el("h2","page-title","📝 Notities"));
  main.appendChild(el("div","page-sub","Persoonlijke sessienotities — opgeslagen in je browser (blijft bewaard na herladen)."));

  renderSyncPanel(main);

  const layout = el("div","","");
  layout.id = "notesLayout";
  main.appendChild(layout);

  const listCol = el("div",""); listCol.id="notesList";
  const editorCol = el("div",""); editorCol.id="noteEditor";
  layout.appendChild(listCol);
  layout.appendChild(editorCol);

  function visibleNotes(){ return loadNotes().filter(n=>!n.deleted); }

  function drawList(){
    const notes = visibleNotes().sort((a,b)=>b.updated-a.updated);
    listCol.innerHTML = "";
    const newBtn = el("button","btn primary","+ Nieuwe notitie");
    newBtn.style.width = "100%"; newBtn.style.marginBottom="10px";
    newBtn.onclick = ()=>{
      const notes = loadNotes();
      const n = {id: Date.now().toString(36), title:"Nieuwe notitie", body:"", book:0, created:Date.now(), updated:Date.now()};
      notes.push(n); saveNotes(notes); activeNoteId = n.id;
      scheduleSyncPush();
      drawList(); drawEditor();
    };
    listCol.appendChild(newBtn);

    if(!notes.length){
      listCol.appendChild(el("div","empty-state","Nog geen notities."));
    }
    notes.forEach(n=>{
      const c = el("div","note-card"+(n.id===activeNoteId?" active":""));
      c.appendChild(el("div","n-title", esc(n.title||"(zonder titel)")));
      const bookLabel = n.book>0 ? ("Boek "+n.book+" · ") : "";
      c.appendChild(el("div","n-meta", bookLabel+new Date(n.updated).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'})));
      c.onclick = ()=>{ activeNoteId = n.id; drawList(); drawEditor(); };
      listCol.appendChild(c);
    });
  }

  function drawEditor(){
    editorCol.innerHTML = "";
    const notes = loadNotes();
    const n = notes.find(x=>x.id===activeNoteId && !x.deleted);
    if(!n){
      editorCol.appendChild(el("div","empty-state","Selecteer of maak een notitie."));
      return;
    }
    const titleInput = el("input",""); titleInput.id="noteTitle"; titleInput.value = n.title; titleInput.placeholder="Titel...";
    editorCol.appendChild(titleInput);

    const toolbar = el("div","note-toolbar");
    const bookSel = el("select",""); bookSel.id="noteBookTag";
    bookSel.innerHTML = `<option value="0">Geen boek-tag</option>` + BOOKS.map(b=>`<option value="${b.id}">Boek ${b.id}: ${esc(b.title)}</option>`).join("");
    bookSel.value = n.book;
    toolbar.appendChild(bookSel);

    const delBtn = el("button","btn danger","Verwijder");
    delBtn.onclick = ()=>{
      if(!confirm("Deze notitie verwijderen?")) return;
      let notes = loadNotes();
      const idx = notes.findIndex(x=>x.id===n.id);
      if(idx!==-1){ notes[idx].deleted = true; notes[idx].updated = Date.now(); }
      saveNotes(notes); activeNoteId = null;
      scheduleSyncPush();
      drawList(); drawEditor();
    };
    toolbar.appendChild(delBtn);
    toolbar.appendChild(el("div","autosave-hint","Automatisch opgeslagen"));
    editorCol.appendChild(toolbar);

    const body = el("textarea",""); body.value = n.body; body.placeholder="Schrijf hier je sessienotities, ideeën, wijzigingen aan het plot...";
    editorCol.appendChild(body);

    function persist(){
      let notes = loadNotes();
      const idx = notes.findIndex(x=>x.id===n.id);
      if(idx===-1) return;
      notes[idx].title = titleInput.value;
      notes[idx].body = body.value;
      notes[idx].book = parseInt(bookSel.value,10);
      notes[idx].updated = Date.now();
      saveNotes(notes);
      scheduleSyncPush();
    }
    let saveTimer;
    function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ persist(); drawList(); }, 500); }
    titleInput.oninput = scheduleSave;
    body.oninput = scheduleSave;
    bookSel.onchange = ()=>{ persist(); };
  }

  drawList();
  if(!activeNoteId){
    const notes = visibleNotes();
    if(notes.length) activeNoteId = notes.sort((a,b)=>b.updated-a.updated)[0].id;
  }
  drawEditor();
}

      saveSessions(sessions); activeSessionId = null;
      scheduleSessionsSyncPush();

      let sessions = loadSessions();

    titleInput.oninput = scheduleSave;
    introArea.oninput = scheduleSave;
    optionsArea.oninput = scheduleSave;
    notesArea.oninput = scheduleSave;
    bookSel.onchange = ()=>{ persist(); };
  }

  drawList();

    if(sessions.length) activeSessionId = sessions.sort((a,b)=>b.updated-a.updated)[0].id;
